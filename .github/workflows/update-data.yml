# 데이터 업데이트: companies/ 아래 모든 기업의 DART 정기보고서·주가를 받아 다시 계산·점검하고 커밋합니다.
# 커밋이 올라가면 Render가 자동으로 다시 배포합니다.
#  - 기업 폴더를 추가하거나 company.json·data/manual/을 고쳐 push하면 바로 실행
#  - 평일 16:40(KST)마다 자동 실행
#  - Actions 탭 → '데이터 업데이트' → Run workflow 로 수동 실행
name: 데이터 업데이트

on:
  push:
    branches: [main]
    paths: ["companies/*/company.json", "companies/*/verify_expectations.json", "companies/*/data/manual/**", "scripts/**", "industries/**", "tests/**", ".github/workflows/**"]
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  test:
    name: 코드 테스트 (가짜 DART 서버)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tests/test_pipeline.py

  update:
    name: 수집 → 계산 → 점검 → 커밋
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: 모든 기업 수집 → 계산 → 점검 → 기업 목록
        id: verify
        continue-on-error: true
        timeout-minutes: 35
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/run_all.py

      - name: 바뀐 데이터 커밋 (수집이 중간에 멈춰도 받은 만큼 저장)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            # 다른 실행이 먼저 데이터를 올렸으면, 자동 생성 파일은 이번(더 최신) 실행 결과를 우선한다
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: 점검 실패 알림
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::데이터 점검에서 '실패' 항목이 있습니다. 사이트의 실행 기록에서 실패한 기업을 찾고, 그 기업 대시보드의 '출처·검증' 화면 또는 companies/<기업>/data/verify_report.json을 확인하세요."
          exit 1
