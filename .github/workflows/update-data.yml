# 데이터 업데이트: DART 정기보고서·주가를 받아 data/를 다시 만들고 점검한 뒤 커밋합니다.
# 커밋이 올라가면 Render가 자동으로 다시 배포합니다.
#  - company.json이나 data/manual/을 고쳐 push하면 바로 실행
#  - 평일 16:40(KST)마다 자동 실행
#  - Actions 탭 → '데이터 업데이트' → Run workflow 로 수동 실행
name: 데이터 업데이트

on:
  push:
    branches: [main]
    paths: ["company.json", "data/manual/**", "scripts/**", "industries/**", "verify_expectations.json"]
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  test:
    name: 코드 테스트 (가짜 DART 서버)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tests/test_pipeline.py

  update:
    name: 수집 → 계산 → 점검 → 커밋
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: DART 정기보고서 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/collect_dart.py

      - name: 주가 수집 (Yahoo)
        run: python scripts/update_stock.py

      - name: 화면용 데이터 만들기
        run: python scripts/build_dataset.py

      - name: 데이터 점검
        id: verify
        continue-on-error: true
        run: python scripts/verify_data.py

      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi

      - name: 점검 실패 알림
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::데이터 점검에서 '실패' 항목이 있습니다. 사이트의 '출처·검증' 화면 또는 data/verify_report.json을 확인하세요."
          exit 1
