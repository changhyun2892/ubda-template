<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경영분석 대시보드</title>
<meta name="description" content="DART 공시 기반 기업 경영분석 대시보드 (UBDA 템플릿). 수업용 분석이며 투자 추천이 아닙니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23444'/%3E%3C/svg%3E">
<script>try { if (localStorage.getItem('ubda_nav_pin') === '1') document.documentElement.classList.add('nav-pinned'); } catch (e) {}</script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app" class="app">
  <div class="nav-edge" id="navEdge" aria-hidden="true"><span>›</span></div>
  <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>
  <nav class="nav" aria-label="메뉴">
    <div class="brand"><div class="brand-mark" id="brandMark">·</div><div><b id="brandName">불러오는 중</b><small id="brandSub"></small></div></div>
    <div class="co-search"><input id="coQ" type="search" placeholder="다른 기업 검색 (이름·종목코드)" autocomplete="off" aria-label="다른 기업 검색"><div id="coSugg" hidden></div></div>
    <ul class="nav-list" id="navList"></ul>
    <button class="nav-pin" id="navPin" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M10 1.5 14.5 6l-2 .5-2.5 2.5.5 3-1.5 1.5L6.5 11 3 14.5 1.5 13 5 9.5 2.5 7 4 5.5l3 .5L9.5 3.5z" fill="currentColor"/></svg>
      <span id="navPinLabel">사이드바 고정</span></button>
    <div class="nav-foot" id="navFoot"></div>
  </nav>
  <main class="center">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">☰</button>
      <div class="page-title"><h1 id="pageTitle">경영분석</h1><p id="pageDesc"></p></div>
      <div id="topFilters"></div>
      <button class="tb-btn" id="editBtn" aria-pressed="false" title="카드를 끌어 배치 변경">배치 편집</button>
      <button class="tb-btn primary" id="askBtn" title="질문하면 CSV로 계산해 답합니다">데이터 질의</button>
    </header>
    <div class="scope" id="scope"></div>
    <section class="workspace" id="workspace" aria-live="polite"><div class="empty">데이터를 불러오는 중…</div></section>
  </main>
  <aside class="panel" id="panel" aria-label="근거 패널"><div class="panel-in" id="panelIn"></div></aside>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<noscript>이 대시보드는 JavaScript가 필요합니다.</noscript>
<script src="assets/app.js"></script>
<script src="assets/query.js"></script>
</body>
</html>
